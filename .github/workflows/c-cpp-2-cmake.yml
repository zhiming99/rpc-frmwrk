name: rpc-frmwrk CI with cmake build

on:
  workflow_dispatch:
  
  push:
    branches: '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: checkout gmssl
      uses: actions/checkout@v5
      with:
          repository: zhiming99/GmSSL
          path: ./gmssl
    - name: update repository
      run: sudo apt-get -o Acquire::Retries=3 update
    - name: install tzdata
      run: sudo DEBIAN_FRONTEND="noninteractive" apt-get -y install tzdata apt-utils
    - name: install kerberos
      run: sudo apt-get install -qq krb5-kdc krb5-admin-server krb5-user nginx
    - name: install tools
      run: sudo apt-get -o Acquire::Retries=3 install -y gcc g++ python3 python3-dev python3-pip python3-build flex bison libtool shtool automake autoconf autotools-dev make dbus dbus-bin libdbus-1-dev libkrb5-dev liblz4-dev lz4 openssl libssl-dev libcppunit-dev bash attr net-tools procps swig ccache libcommons-cli-java webpack python3-urwid gettext locales fuse3 libfuse3-dev libjsoncpp-dev curl expect
    - name: pip install
      run:  pip3 install numpy wheel sip

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
            node-version: '24'

    - name: js library install
      run: npm -g install browserify buffer long lz4 process put safe-buffer stream minify xxhashjs webpack webpack-cli events js-sha1 stream-browserify

    - name: install sip
      run: sudo apt-get -y install sip-tools python3-sipbuild python3-wheel ||sudo apt-get -y install sip-dev python3-sip python3-sip-dev || true;

    - name: build gmssl
      run: cd ./gmssl/;mkdir build;cd build;cmake ..;make;sudo make install

    - name: configure
      run: mkdir build && cd build && cmake -DENABLE_KRB5=ON -DENABLE_TESTCASES=ON -DENABLE_JAVA=ON ..;
    - name: make
      run: cd build && cat /proc/cpuinfo && cmake --build . -j4
    - name: install
      run: cd build && sudo cmake --install .

    - name: initsvr
      run: /usr/local/bin/rpcfctl initsvr

    - name: configure kerberos
      run: sudo bash ./tools/initkrb5.sh
    - name: cleanup for kerberos test
      run: bash tools/cfg4ssl.sh krb5cfg.json.in
    - name: starting kerberos servers
      run: dbus-run-session bash tools/runtest.sh 2 k & 
    - name: starting kerberos test
      timeout-minutes: 100
      run: dbus-run-session bash tools/runtest.sh 1 k
      
    - name: install debian package tools
      run: sudo apt-get -o Acquire::Retries=3 -y install devscripts debhelper
    - name: make debian package
      run: cd build; cmake .. && cpack -G DEB; sudo apt-get -y install ./rpcf_*deb && sudo apt-get install ./rpcf-dev_*deb
    - name: upload debian packages
      uses: actions/upload-artifact@v5
      with:
          name: runtime-package
          path: |
            build/rpcf_*.deb
            build/rpcf-dev_*.deb

    - name: flush logs
      if: always()
      run: kill -3 `pidof rpcf_logger` || true;sleep 2

    - name: Upload Test Results on Canceled
      if: always()
      uses: actions/upload-artifact@v5
      with:
          name: logfiles
          path: |
            ./logfile
            ./logdump.txt
            ./logger.txt

      
