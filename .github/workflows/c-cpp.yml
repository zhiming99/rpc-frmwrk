name: rpc-frmwrk CI with deb

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: checkout gmssl
      uses: actions/checkout@v4
      with:
          repository: zhiming99/GmSSL
          path: ./gmssl

    - name: update repository
      run: sudo apt-get -o Acquire::Retries=3 update
    - name: install tzdata
      run: sudo DEBIAN_FRONTEND="noninteractive" apt-get -y install tzdata apt-utils
    - name: install tools
      run: sudo apt-get -o Acquire::Retries=3 install -y gcc g++ python3 python3-dev python3-pip python3-build flex bison libtool shtool automake autoconf autotools-dev make dbus dbus-bin libdbus-1-dev libkrb5-dev liblz4-dev lz4 openssl libssl-dev libcppunit-dev bash attr net-tools procps swig ccache libcommons-cli-java npm webpack python3-urwid gettext locales fuse3 libfuse3-dev libjsoncpp-dev 
    - name: pip install
      run:  pip3 install numpy wheel sip
    - name: npm install
      run: npm -g install browserify buffer long lz4 process put safe-buffer stream minify xxhashjs webpack webpack-cli events js-sha1 stream-browserify

    - name: install sip
      run: sudo apt-get -y install sip-tools python3-sipbuild ||sudo apt-get -y install sip-dev python3-sip python3-sip-dev || true;

    - name: build gmssl
      run: cd ./gmssl/;mkdir build;cd build;cmake ..;make;sudo make install

    - name: setup build env
      run: libtoolize;aclocal;autoreconf -vfi;automake --add-missing;autoconf;
    - name: configure
      run: bash ./cfgsel -r
    - name: make
      run: cat /proc/cpuinfo && make -j 4
    - name: install
      run: sudo make install

    - name: initsvr
      run: /usr/local/bin/rpcfctl initsvr

    - name: cleanup for test
      run: sudo python3 /usr/local/bin/rpcf/rpcfgnui.py tools/testcfgs/mincfg.json

    - name: registry test
      run:  bash tools/regtest.sh

    - name: starting servers
      run: dbus-run-session bash tools/runtest.sh 2 & 

    - name: starting test
      timeout-minutes: 100
      run: dbus-run-session bash tools/runtest.sh 1
    - name: cleanup for ssl test
      run: bash tools/cfg4ssl.sh sslcfg.json.in

    - name: starting ssl servers
      run: dbus-run-session bash tools/runtest.sh 2 & 
    - name: starting ssl test
      timeout-minutes: 100
      run: dbus-run-session bash tools/runtest.sh 1

    - name: testing ridlc
      run: bash tools/ridlctst.sh

    - name: install debian package tools
      run: sudo apt-get -o Acquire::Retries=3 -y install devscripts debhelper
    - name: make debian package
      run: make -j 4 deb && cd bldpkg && ls -ltr *.deb && sudo apt-get -y install ./rpcf_*deb ./rpcf-dev_*deb
    - name: upload debian packages
      uses: actions/upload-artifact@v4
      with:
          name: runtime-package
          path: |
            bldpkg/rpcf_*.deb
            bldpkg/rpcf-dev_*.deb

    - name: flush logs
      if: always()
      run: kill -3 `pidof rpcf_logger` || true;sleep 2

    - name: Upload Test Results on Canceled
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: logfiles
          path: |
            ./logfile
            ./logdump.txt
            ./logger.txt
